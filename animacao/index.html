    <label>Interação

        <option value="scroll">Scroll</option>
        <option value="mouse">Rato</option>
        <option value="letters">Rato por letra</option>
      </select>
    </label>
    <label class="size-control" for="logo-size">Tamanho
      <input id="logo-size" type="range" min="20" max="100" value="100" />
      <output id="size-value" for="logo-size">100%</output>
    </label>
  </form>
